<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대로와 나나의 오키나와 스노클링맵</title>
<meta name="description" content="오키나와 스노클링 포인트와 해변 안전 정보를 정리한 지도입니다.">
<style>
  body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Pretendard',sans-serif;background:#e8fafa;color:#06333a;display:grid;place-items:center;text-align:center;padding:24px}
  .box{max-width:320px;line-height:1.6}.icon{font-size:44px;margin-bottom:10px}a{color:#007c89;font-weight:800}
</style>
<script>
const MAP_QUERY = {
  '1':'クエフ島 Kuefu Beach 沖縄県','2':'神山島 Kamiyama Island 沖縄県','3':'宮城海岸 沖縄県中頭郡北谷町宮城','4':'ナカユクイ展望台 沖縄県国頭郡恩納村瀬良垣','5':'裏真栄田ビーチ 沖縄県国頭郡恩納村真栄田','6':'青の洞窟 沖縄県国頭郡恩納村真栄田','7':'古宇利ビーチ 沖縄県国頭郡今帰仁村古宇利','8':'長浜ビーチ 沖縄県国頭郡今帰仁村諸志','9':'エメラルドビーチ 沖縄県国頭郡本部町備瀬','10':'幸喜ビーチ 沖縄県名護市幸喜','11':'恩納村海浜公園ナビービーチ 沖縄県国頭郡恩納村恩納419-4','12':'万座ビーチ 沖縄県国頭郡恩納村瀬良垣2260','13':'アポガマ 沖縄県国頭郡恩納村字恩納4484','14':'アンチ浜 沖縄県国頭郡本部町瀬底','15':'水納ビーチ 沖縄県国頭郡本部町水納島','16':'備瀬崎 沖縄県国頭郡本部町備瀬','17':'瀬底ビーチ 沖縄県国頭郡本部町瀬底5750','18':'ゴリラチョップ 沖縄県国頭郡本部町崎本部','19':'皆田海岸 鹿児島県大島郡与論町古里',
  B1:'ジョン万ビーチ 大度海岸 沖縄県糸満市大度',B2:'北名城ビーチ 沖縄県糸満市名城960',B3:'砂辺海岸 沖縄県中頭郡北谷町砂辺',B4:'ダイヤモンドビーチ 沖縄県国頭郡恩納村瀬良垣',B5:'恩納ポイント 沖縄県国頭郡恩納村恩納',B6:'伊計ビーチ 沖縄県うるま市与那城伊計',B7:'トケイ浜 ポットホール 沖縄県国頭郡今帰仁村古宇利島',B8:'チヌグ浜 チグヌ浜 沖縄県国頭郡今帰仁村古宇利島'
};
function mapsUrl(id, lat, lng){
  const query = MAP_QUERY[id] || `${lat},${lng}`;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
}
function rewriteMapLinksScript(){
  return `<script>
  const MAP_QUERY = ${JSON.stringify(MAP_QUERY)};
  function mapsUrlForId(id, fallback){
    const query = MAP_QUERY[id] || fallback;
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
  }
  function rewriteMapLinks(){
    document.querySelectorAll('details.card').forEach((card)=>{
      const num = card.querySelector('.num');
      const id = num && (num.dataset.id || num.textContent.trim());
      const first = card.querySelector('.actions a:first-child');
      if (!id || !first || first.textContent.trim() === '동굴 포인트') return;
      first.href = mapsUrlForId(id, first.href.split('query=')[1] || '');
    });
  }
  document.addEventListener('DOMContentLoaded', rewriteMapLinks);
  setTimeout(rewriteMapLinks, 0);
<\/script>`;
}
function applyV10Patch(html){
  const replacements = [
    [/26\.6416824,127\.8559382/g, '26.650665072117175,127.8565882474518'],
    [/lat:26\.6416824, lng:127\.8559382/g, 'lat:26.650665072117175, lng:127.8565882474518'],
    [/26\.5103445,127\.8509382/g, '26.49936239528,127.8418922423'],
    [/lat:26\.5103445, lng:127\.8509382/g, 'lat:26.49936239528, lng:127.8418922423'],
    [/26\.5085448,127\.8596123/g, '26.505994148535816,127.85920652562834'],
    [/lat:26\.5085448, lng:127\.8596123/g, 'lat:26.505994148535816, lng:127.85920652562834'],
    [/アポガマ, 沖縄県国頭郡恩納村恩納周辺/g, 'アポガマ, 〒904-0411 沖縄県国頭郡恩納村字恩納4484先'],
    [/瀬底ビーチ, 沖縄県国頭郡本部町瀬底(?!5750)/g, '瀬底ビーチ, 沖縄県国頭郡本部町瀬底5750'],
    [/Ver\.7 · 2026\.05\.20 업데이트/g, 'Ver.10 · 2026.06.04 업데이트'],
    [/Ver\.8 · 2026\.06\.04 업데이트/g, 'Ver.10 · 2026.06.04 업데이트'],
    [/Ver\.9 · 2026\.06\.04 업데이트/g, 'Ver.10 · 2026.06.04 업데이트']
  ];
  replacements.forEach(([from,to]) => { html = html.replace(from, to); });

  const oldBlueCave = '<div class="actions"><a href="https://www.google.com/maps/search/?api=1&query=26.4442875,127.7745368" target="_blank" rel="noopener">지도 열기</a></div>';
  const newBlueCave = '<div class="actions"><a href="https://www.google.com/maps/search/?api=1&query=26.4442875,127.7745368" target="_blank" rel="noopener">동굴 포인트</a><a class="secondary" href="https://www.google.com/maps/search/?api=1&query=26.443714532317824,127.77251499818074" target="_blank" rel="noopener">접근 위치</a><a class="secondary" href="https://www.google.com/maps/search/?api=1&query=%E9%9D%92%E3%81%AE%E6%B4%9E%E7%AA%9F%20%E6%B2%96%E7%B8%84%E7%9C%8C%E5%9B%BD%E9%A0%AD%E9%83%A1%E6%81%A9%E7%B4%8D%E6%9D%91%E7%9C%9F%E6%A0%84%E7%94%B0" target="_blank" rel="noopener">장소 보기</a></div>';
  html = html.replace(oldBlueCave, newBlueCave);
  if (!html.includes('26.443714532317824,127.77251499818074')) {
    html = html.replace(/(<a href="https:\/\/www\.google\.com\/maps\/search\/\?api=1&query=26\.4442875,127\.7745368" target="_blank" rel="noopener">)(지도 열기|동굴 포인트)(<\/a>)/, '$1동굴 포인트$3<a class="secondary" href="https://www.google.com/maps/search/?api=1&query=26.443714532317824,127.77251499818074" target="_blank" rel="noopener">접근 위치</a>');
  }

  html = html.replace(
    'function markerColor(point) {',
    `const MAP_QUERY = ${JSON.stringify(MAP_QUERY)};\nfunction mapUrlFor(point) {\n  const query = MAP_QUERY[point.id] || \`${'${point.lat},${point.lng}'}\`;\n  return \`https://www.google.com/maps/search/?api=1&query=${'${encodeURIComponent(query)}'}\`;\n}\nfunction markerColor(point) {`
  );
  html = html.replace(/const mapsUrl = `https:\/\/www\.google\.com\/maps\/search\/\?api=1&query=\$\{point\.lat\},\$\{point\.lng\}`;/g, 'const mapsUrl = mapUrlFor(point);');
  html = html.replace('</body>', `${rewriteMapLinksScript()}</body>`);
  return html;
}
(async function(){
  try{
    const response = await fetch('/test/', {cache:'no-store'});
    if(!response.ok) throw new Error('load failed');
    const html = applyV10Patch(await response.text());
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.addEventListener('DOMContentLoaded', function(){
      document.body.innerHTML = '<div class="box"><div class="icon">🤿</div><h1>오키나와 스노클링맵</h1><p>페이지를 불러오지 못했습니다.</p><p><a href="https://daeronana.com/test/">테스트 페이지로 이동하기</a></p></div>';
    });
  }
})();
</script>
</head>
<body>
  <div class="box"><div class="icon">🤿</div><h1>오키나와 스노클링맵</h1><p>지도를 불러오는 중입니다.</p></div>
</body>
</html>
